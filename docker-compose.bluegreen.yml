name: daehyun-backend

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "${DOCKER_LOG_MAX_SIZE:-10m}"
    max-file: "${DOCKER_LOG_MAX_FILE:-5}"

x-app-common: &app-common
  image: ${APP_IMAGE:-ghcr.io/daehyuh/daehyun-backend}:${APP_IMAGE_TAG:-latest}
  restart: unless-stopped
  depends_on:
    - db
  environment:
    SPRING_APPLICATION_NAME: ${SPRING_APPLICATION_NAME:-daehyun-backend}
    SPRING_MAIN_ALLOW_BEAN_DEFINITION_OVERRIDING: ${SPRING_MAIN_ALLOW_BEAN_DEFINITION_OVERRIDING:-true}
    SERVER_ERROR_INCLUDE_MESSAGE: ${SERVER_ERROR_INCLUDE_MESSAGE:-always}
    SERVER_ERROR_INCLUDE_BINDING_ERRORS: ${SERVER_ERROR_INCLUDE_BINDING_ERRORS:-always}
    SERVER_ERROR_INCLUDE_STACKTRACE: ${SERVER_ERROR_INCLUDE_STACKTRACE:-always}
    SERVER_ERROR_INCLUDE_EXCEPTION: ${SERVER_ERROR_INCLUDE_EXCEPTION:-false}
    SPRING_PROFILES_INCLUDE: ${SPRING_PROFILES_INCLUDE:-db,jwt,security,file}
    SPRING_JPA_SHOW_SQL: ${SPRING_JPA_SHOW_SQL:-true}
    SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_HIBERNATE_DDL_AUTO:-update}
    SPRING_JPA_DATABASE_PLATFORM: ${SPRING_JPA_DATABASE_PLATFORM:-org.hibernate.dialect.MariaDBDialect}
    SPRING_DATASOURCE_DRIVER_CLASS_NAME: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:-org.mariadb.jdbc.Driver}
    SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:mariadb://db:3306/daehyun}
    SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-root}
    SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?Set SPRING_DATASOURCE_PASSWORD}
    JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
    JWT_ACCESS_TOKEN_EXPIRATION: ${JWT_ACCESS_TOKEN_EXPIRATION:-86400000}
    JWT_REFRESH_TOKEN_EXPIRATION: ${JWT_REFRESH_TOKEN_EXPIRATION:-2592000000}
    GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:?Set GOOGLE_OAUTH_CLIENT_ID}
    GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:?Set GOOGLE_OAUTH_CLIENT_SECRET}
    GOOGLE_OAUTH_REDIRECT_URI: ${GOOGLE_OAUTH_REDIRECT_URI:-http://localhost:8080/login/oauth2/code/google}
    GOOGLE_OAUTH_SCOPE: ${GOOGLE_OAUTH_SCOPE:-profile,email}
    ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD}
    ADMIN_BASIC_USERNAME: ${ADMIN_BASIC_USERNAME:-admin}
    ADMIN_BASIC_PASSWORD: ${ADMIN_BASIC_PASSWORD:-password}
    FRONTEND_URL: ${FRONTEND_URL:-https://daehyun.dev}
    FRONTEND_DOMAIN: ${FRONTEND_DOMAIN:-daehyun.dev}
    IMAGE_UPLOAD_DIR: ${IMAGE_UPLOAD_DIR:-/upload/images}
    MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: ${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:-health,prometheus}
    RANK_PAGE_DEFAULT_SIZE: ${RANK_PAGE_DEFAULT_SIZE:-50}
    RANK_PAGE_MAX_SIZE: ${RANK_PAGE_MAX_SIZE:-200}
    RANK_CACHE_TTL_SECONDS: ${RANK_CACHE_TTL_SECONDS:-60}
    RANK_SNAPSHOT_MAX_AGE_SECONDS: ${RANK_SNAPSHOT_MAX_AGE_SECONDS:-900}
    TRIBUNAL_AI_ENABLED: ${TRIBUNAL_AI_ENABLED:-true}
    TRIBUNAL_AI_BASE_URL: ${TRIBUNAL_AI_BASE_URL:-http://host.docker.internal:8010}
    TRIBUNAL_AI_API_KEY: ${TRIBUNAL_AI_API_KEY:-}
    TRIBUNAL_AI_CONNECT_TIMEOUT_MS: ${TRIBUNAL_AI_CONNECT_TIMEOUT_MS:-5000}
    TRIBUNAL_AI_READ_TIMEOUT_MS: ${TRIBUNAL_AI_READ_TIMEOUT_MS:-120000}
    TRIBUNAL_AI_EXECUTOR_CORE_POOL_SIZE: ${TRIBUNAL_AI_EXECUTOR_CORE_POOL_SIZE:-1}
    TRIBUNAL_AI_EXECUTOR_MAX_POOL_SIZE: ${TRIBUNAL_AI_EXECUTOR_MAX_POOL_SIZE:-2}
    TRIBUNAL_AI_EXECUTOR_QUEUE_CAPACITY: ${TRIBUNAL_AI_EXECUTOR_QUEUE_CAPACITY:-100}
    TZ: ${TZ:-Asia/Seoul}
  extra_hosts:
    - "host.docker.internal:host-gateway"
  volumes:
    - ./image:/upload/images
  expose:
    - "8080"
  networks:
    - backend
  logging: *default-logging

services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${PUBLIC_PORT:-8080}:80"
    volumes:
      - ./deploy/runtime/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - backend
    logging: *default-logging

  app-blue:
    <<: *app-common
    container_name: daehyun-backend-app-blue

  app-green:
    <<: *app-common
    container_name: daehyun-backend-app-green

  db:
    image: mariadb:10.6
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?Set MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-daehyun}
    ports:
      - "${DB_BIND_ADDRESS:-127.0.0.1}:3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - backend
    logging: *default-logging

networks:
  backend:

volumes:
  mariadb_data:
