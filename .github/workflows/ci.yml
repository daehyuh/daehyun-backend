name: CI/CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Grant Gradle wrapper execute permission
        run: chmod +x ./gradlew

      - name: Build boot jar
        run: ./gradlew bootJar --no-daemon

      - name: Prepare image metadata
        id: meta
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          IMAGE_TAG="${GITHUB_SHA}"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.image_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Docker image
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.image_tag }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy production
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && vars.ENABLE_PROD_DEPLOY == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    concurrency:
      group: production
      cancel-in-progress: false
    steps:
      - name: Validate deployment configuration
        env:
          DEPLOY_ENV_FILE: ${{ secrets.DEPLOY_ENV_FILE }}
          APP_IMAGE: ${{ needs.build.outputs.image }}
          APP_IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
        run: |
          REQUESTED_APP_IMAGE="$APP_IMAGE"
          REQUESTED_APP_IMAGE_TAG="$APP_IMAGE_TAG"

          test -n "$DEPLOY_ENV_FILE"
          mkdir -p .deploy-env
          printf '%s\n' "$DEPLOY_ENV_FILE" > .deploy-env/.env
          python3 <<'PY'
          import os
          import re
          import shlex
          import subprocess
          from pathlib import Path

          env_path = Path(".deploy-env/.env")
          text = env_path.read_text(encoding="utf-8").replace("\r\n", "\n").replace("\r", "\n")
          env_path.write_text(text, encoding="utf-8")

          def parse_dotenv(source: str) -> dict[str, str]:
              parsed: dict[str, str] = {}
              lines = source.splitlines()
              index = 0
              while index < len(lines):
                  line_number = index + 1
                  line = lines[index]
                  index += 1
                  stripped = line.strip()
                  if not stripped or stripped.startswith("#"):
                      continue
                  if "=" not in line:
                      raise SystemExit(f"Invalid DEPLOY_ENV_FILE line {line_number}: expected KEY=value")
                  key, value = line.split("=", 1)
                  key = key.strip()
                  value = value.strip()
                  if not re.fullmatch(r"[A-Za-z_][A-Za-z0-9_]*", key):
                      raise SystemExit(f"Invalid DEPLOY_ENV_FILE key on line {line_number}: {key}")
                  if value.startswith("'") or value.startswith('"'):
                      quote = value[0]
                      chunks = [value[1:]]
                      while not chunks[-1].endswith(quote):
                          if index >= len(lines):
                              raise SystemExit(f"Unterminated quoted value for {key}")
                          chunks.append(lines[index])
                          index += 1
                      chunks[-1] = chunks[-1][:-1]
                      value = "\n".join(chunks)
                  parsed[key] = value
              return parsed

          def required(values: dict[str, str], key: str) -> None:
              if not values.get(key):
                  raise SystemExit(f"Missing required DEPLOY_ENV_FILE value: {key}")

          def write_shell_env(path: Path, values: dict[str, str], keys: list[str]) -> None:
              lines = []
              for key in keys:
                  value = values.get(key, "")
                  if "\n" in value:
                      raise SystemExit(f"{key} cannot contain newlines in ci.env")
                  lines.append(f"export {key}={shlex.quote(value)}")
              path.write_text("\n".join(lines) + "\n", encoding="utf-8")

          def format_env_line(key: str, value: str) -> str:
              if "\n" in value:
                  raise SystemExit(f"{key} cannot contain newlines in server .env")
              return f"{key}={shlex.quote(value)}\n"

          values = parse_dotenv(text)
          for key in [
              "PROD_SSH_HOST",
              "PROD_SSH_USER",
              "PROD_APP_DIR",
              "PROD_SSH_PRIVATE_KEY",
              "SPRING_DATASOURCE_PASSWORD",
              "MARIADB_ROOT_PASSWORD",
              "JWT_SECRET",
              "JWT_ACCESS_TOKEN_EXPIRATION",
              "JWT_REFRESH_TOKEN_EXPIRATION",
              "GOOGLE_OAUTH_CLIENT_ID",
              "GOOGLE_OAUTH_CLIENT_SECRET",
              "ADMIN_PASSWORD",
              "FRONTEND_URL",
              "FRONTEND_DOMAIN",
          ]:
              required(values, key)

          if values.get("ENABLE_MONITORING", "false") == "true":
              required(values, "GRAFANA_ADMIN_PASSWORD")

          prod_key = "\n".join(line.strip() for line in values["PROD_SSH_PRIVATE_KEY"].splitlines() if line.strip()) + "\n"
          prod_key_path = Path(".deploy-env/prod_key")
          prod_key_path.write_text(prod_key, encoding="utf-8")
          prod_key_path.chmod(0o600)
          if subprocess.run(["ssh-keygen", "-y", "-f", str(prod_key_path)], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL).returncode != 0:
              raise SystemExit("PROD_SSH_PRIVATE_KEY is not a valid private key. Paste the private key file contents, not the public key.")

          values.setdefault("PROD_SSH_PORT", "22")
          write_shell_env(
              Path(".deploy-env/ci.env"),
              values,
              ["PROD_SSH_HOST", "PROD_SSH_USER", "PROD_SSH_PORT", "PROD_APP_DIR"],
          )

          server_env = []
          for key, value in values.items():
              if (
                  key.startswith("PROD_SSH_")
                  or key in {"PROD_APP_DIR", "DEPLOY_ENV_FILE", "APP_IMAGE", "APP_IMAGE_TAG"}
              ):
                  continue
              server_env.append(format_env_line(key, value))
          server_env.append(format_env_line("APP_IMAGE", os.environ["APP_IMAGE"]))
          server_env.append(format_env_line("APP_IMAGE_TAG", os.environ["APP_IMAGE_TAG"]))
          Path(".deploy-env/server.env").write_text("".join(server_env), encoding="utf-8")
          print("Deployment environment parsed and validated.")
          PY

      - name: Configure SSH
        run: |
          . .deploy-env/ci.env
          PROD_SSH_PORT="${PROD_SSH_PORT:-22}"

          mkdir -p ~/.ssh
          cp .deploy-env/prod_key ~/.ssh/prod_key
          chmod 600 ~/.ssh/prod_key
          ssh-keyscan -p "$PROD_SSH_PORT" -H "$PROD_SSH_HOST" >> ~/.ssh/known_hosts

      - name: Sync deployment environment file
        run: |
          . .deploy-env/ci.env
          PROD_SSH_PORT="${PROD_SSH_PORT:-22}"

          ssh -i ~/.ssh/prod_key -p "$PROD_SSH_PORT" "$PROD_SSH_USER@$PROD_SSH_HOST" \
            "mkdir -p '$PROD_APP_DIR'"
          scp -i ~/.ssh/prod_key -P "$PROD_SSH_PORT" \
            .deploy-env/server.env \
            "$PROD_SSH_USER@$PROD_SSH_HOST:$PROD_APP_DIR/.env"

          ssh -i ~/.ssh/prod_key -p "$PROD_SSH_PORT" "$PROD_SSH_USER@$PROD_SSH_HOST" \
            "chmod 600 '$PROD_APP_DIR/.env'"

      - name: Deploy over SSH
        env:
          APP_IMAGE: ${{ needs.build.outputs.image }}
          APP_IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
        run: |
          REQUESTED_APP_IMAGE="$APP_IMAGE"
          REQUESTED_APP_IMAGE_TAG="$APP_IMAGE_TAG"

          . .deploy-env/ci.env
          PROD_SSH_PORT="${PROD_SSH_PORT:-22}"

          ssh -i ~/.ssh/prod_key -p "$PROD_SSH_PORT" "$PROD_SSH_USER@$PROD_SSH_HOST" \
            "PROD_APP_DIR='$PROD_APP_DIR' APP_IMAGE='$REQUESTED_APP_IMAGE' APP_IMAGE_TAG='$REQUESTED_APP_IMAGE_TAG' bash -se" <<'REMOTE_DEPLOY'
          set -Eeuo pipefail

          cd "$PROD_APP_DIR"
          git fetch origin main
          git checkout main

          if ! git diff --quiet || ! git diff --cached --quiet; then
            stash_message="ci pre-deploy tracked changes $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git stash push -m "$stash_message" -- .
            echo "Stashed local tracked changes before deploy: $stash_message"
          fi

          git pull --ff-only origin main
          APP_IMAGE="$APP_IMAGE" APP_IMAGE_TAG="$APP_IMAGE_TAG" bash deploy/deploy-bluegreen.sh
          bash deploy/apply-host-nginx.sh
          bash deploy/deploy-monitoring.sh
          REMOTE_DEPLOY
