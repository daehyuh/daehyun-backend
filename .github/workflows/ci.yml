name: CI/CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Grant Gradle wrapper execute permission
        run: chmod +x ./gradlew

      - name: Build boot jar
        run: ./gradlew bootJar --no-daemon

      - name: Prepare image metadata
        id: meta
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          IMAGE_TAG="${GITHUB_SHA}"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.image_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Docker image
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.image_tag }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy production
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && vars.ENABLE_PROD_DEPLOY == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    concurrency:
      group: production
      cancel-in-progress: false
    steps:
      - name: Validate deployment configuration
        env:
          DEPLOY_ENV_FILE: ${{ secrets.DEPLOY_ENV_FILE }}
          APP_IMAGE: ${{ needs.build.outputs.image }}
          APP_IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
        run: |
          REQUESTED_APP_IMAGE="$APP_IMAGE"
          REQUESTED_APP_IMAGE_TAG="$APP_IMAGE_TAG"

          test -n "$DEPLOY_ENV_FILE"
          mkdir -p .deploy-env
          printf '%s\n' "$DEPLOY_ENV_FILE" > .deploy-env/.env
          sed -i 's/\r$//' .deploy-env/.env

          set -a
          . .deploy-env/.env
          set +a

          test -n "$PROD_SSH_HOST"
          test -n "$PROD_SSH_USER"
          test -n "$PROD_APP_DIR"
          test -n "$SPRING_DATASOURCE_PASSWORD"
          test -n "$MARIADB_ROOT_PASSWORD"

          if [ -z "${PROD_SSH_PRIVATE_KEY:-}" ]; then
            echo "Set PROD_SSH_PRIVATE_KEY in DEPLOY_ENV_FILE." >&2
            exit 1
          fi

          if [ "${ENABLE_MONITORING:-false}" = "true" ]; then
            test -n "$GRAFANA_ADMIN_PASSWORD"
          fi

          printf '%s\n' "$PROD_SSH_PRIVATE_KEY" \
            | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e '/^$/d' \
            > .deploy-env/prod_key
          chmod 600 .deploy-env/prod_key
          if ! ssh-keygen -y -f .deploy-env/prod_key >/dev/null 2>&1; then
            echo "PROD_SSH_PRIVATE_KEY is not a valid private key. Paste the private key file contents, not the ssh-rsa/ssh-ed25519 public key." >&2
            exit 1
          fi

          awk '
            /^PROD_SSH_PRIVATE_KEY=/ {
              if ($0 ~ /^PROD_SSH_PRIVATE_KEY='\''/ && $0 !~ /'\''$/) {
                skip_private_key = 1
              }
              next
            }
            skip_private_key {
              if ($0 ~ /'\''$/) {
                skip_private_key = 0
              }
              next
            }
            /^(PROD_SSH_|PROD_APP_DIR=|DEPLOY_ENV_FILE=|APP_IMAGE=|APP_IMAGE_TAG=)/ { next }
            { print }
          ' .deploy-env/.env > .deploy-env/.env.production
          {
            printf 'APP_IMAGE=%s\n' "$REQUESTED_APP_IMAGE"
            printf 'APP_IMAGE_TAG=%s\n' "$REQUESTED_APP_IMAGE_TAG"
          } >> .deploy-env/.env.production

      - name: Configure SSH
        run: |
          set -a
          . .deploy-env/.env
          set +a
          PROD_SSH_PORT="${PROD_SSH_PORT:-22}"

          mkdir -p ~/.ssh
          cp .deploy-env/prod_key ~/.ssh/prod_key
          chmod 600 ~/.ssh/prod_key
          ssh-keyscan -p "$PROD_SSH_PORT" -H "$PROD_SSH_HOST" >> ~/.ssh/known_hosts

      - name: Sync deployment environment file
        run: |
          set -a
          . .deploy-env/.env
          set +a
          PROD_SSH_PORT="${PROD_SSH_PORT:-22}"

          ssh -i ~/.ssh/prod_key -p "$PROD_SSH_PORT" "$PROD_SSH_USER@$PROD_SSH_HOST" \
            "mkdir -p '$PROD_APP_DIR/deploy'"
          scp -i ~/.ssh/prod_key -P "$PROD_SSH_PORT" \
            .deploy-env/.env.production \
            "$PROD_SSH_USER@$PROD_SSH_HOST:$PROD_APP_DIR/deploy/.env.production"

          ssh -i ~/.ssh/prod_key -p "$PROD_SSH_PORT" "$PROD_SSH_USER@$PROD_SSH_HOST" \
            "chmod 600 '$PROD_APP_DIR/deploy/.env.production'"

      - name: Deploy over SSH
        env:
          APP_IMAGE: ${{ needs.build.outputs.image }}
          APP_IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
        run: |
          REQUESTED_APP_IMAGE="$APP_IMAGE"
          REQUESTED_APP_IMAGE_TAG="$APP_IMAGE_TAG"

          set -a
          . .deploy-env/.env
          set +a
          PROD_SSH_PORT="${PROD_SSH_PORT:-22}"

          ssh -i ~/.ssh/prod_key -p "$PROD_SSH_PORT" "$PROD_SSH_USER@$PROD_SSH_HOST" \
            "PROD_APP_DIR='$PROD_APP_DIR' APP_IMAGE='$REQUESTED_APP_IMAGE' APP_IMAGE_TAG='$REQUESTED_APP_IMAGE_TAG' bash -se" <<'REMOTE_DEPLOY'
          set -Eeuo pipefail

          cd "$PROD_APP_DIR"
          git fetch origin main
          git checkout main

          if ! git diff --quiet || ! git diff --cached --quiet; then
            stash_message="ci pre-deploy tracked changes $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git stash push -m "$stash_message" -- .
            echo "Stashed local tracked changes before deploy: $stash_message"
          fi

          git pull --ff-only origin main
          APP_IMAGE="$APP_IMAGE" APP_IMAGE_TAG="$APP_IMAGE_TAG" bash deploy/deploy-bluegreen.sh
          bash deploy/apply-host-nginx.sh
          bash deploy/deploy-monitoring.sh
          REMOTE_DEPLOY
