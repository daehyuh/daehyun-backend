spring.application.name=${SPRING_APPLICATION_NAME:daehyun-backend}

spring.main.allow-bean-definition-overriding=${SPRING_MAIN_ALLOW_BEAN_DEFINITION_OVERRIDING:true}
server.error.include-message=${SERVER_ERROR_INCLUDE_MESSAGE:always}
server.error.include-binding-errors=${SERVER_ERROR_INCLUDE_BINDING_ERRORS:always}
server.error.include-stacktrace=${SERVER_ERROR_INCLUDE_STACKTRACE:always}
server.error.include-exception=${SERVER_ERROR_INCLUDE_EXCEPTION:false}

spring.profiles.include=${SPRING_PROFILES_INCLUDE:db,jwt,security,file}

rank.page.default-size=${RANK_PAGE_DEFAULT_SIZE:50}
rank.page.max-size=${RANK_PAGE_MAX_SIZE:200}
rank.cache.ttl-seconds=${RANK_CACHE_TTL_SECONDS:60}
rank.snapshot.max-age-seconds=${RANK_SNAPSHOT_MAX_AGE_SECONDS:900}
