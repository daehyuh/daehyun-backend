spring.application.name=${SPRING_APPLICATION_NAME:daehyun-backend}

spring.main.allow-bean-definition-overriding=${SPRING_MAIN_ALLOW_BEAN_DEFINITION_OVERRIDING:true}
server.error.include-message=${SERVER_ERROR_INCLUDE_MESSAGE:always}
server.error.include-binding-errors=${SERVER_ERROR_INCLUDE_BINDING_ERRORS:always}
server.error.include-stacktrace=${SERVER_ERROR_INCLUDE_STACKTRACE:always}
server.error.include-exception=${SERVER_ERROR_INCLUDE_EXCEPTION:false}

spring.profiles.include=${SPRING_PROFILES_INCLUDE:db,jwt,security,file}

rank.page.default-size=${RANK_PAGE_DEFAULT_SIZE:50}
rank.page.max-size=${RANK_PAGE_MAX_SIZE:200}
rank.cache.ttl-seconds=${RANK_CACHE_TTL_SECONDS:60}
rank.snapshot.max-age-seconds=${RANK_SNAPSHOT_MAX_AGE_SECONDS:900}

account.sync.default-refresh-interval-seconds=${ACCOUNT_SYNC_DEFAULT_REFRESH_INTERVAL_SECONDS:900}

migration.legacy-record.enabled=${MIGRATION_LEGACY_RECORD_ENABLED:true}
migration.legacy-record.batch-size=${MIGRATION_LEGACY_RECORD_BATCH_SIZE:500}
migration.legacy-record.fixed-delay-ms=${MIGRATION_LEGACY_RECORD_FIXED_DELAY_MS:30000}
migration.legacy-record.initial-delay-ms=${MIGRATION_LEGACY_RECORD_INITIAL_DELAY_MS:10000}

tribunal.replay.connect-timeout-ms=${TRIBUNAL_REPLAY_CONNECT_TIMEOUT_MS:5000}
tribunal.replay.read-timeout-ms=${TRIBUNAL_REPLAY_READ_TIMEOUT_MS:10000}

tribunal.ai.enabled=${TRIBUNAL_AI_ENABLED:true}
tribunal.ai.base-url=${TRIBUNAL_AI_BASE_URL:http://127.0.0.1:8010}
tribunal.ai.api-key=${TRIBUNAL_AI_API_KEY:}
tribunal.ai.connect-timeout-ms=${TRIBUNAL_AI_CONNECT_TIMEOUT_MS:5000}
tribunal.ai.read-timeout-ms=${TRIBUNAL_AI_READ_TIMEOUT_MS:120000}
tribunal.ai.executor.core-pool-size=${TRIBUNAL_AI_EXECUTOR_CORE_POOL_SIZE:1}
tribunal.ai.executor.max-pool-size=${TRIBUNAL_AI_EXECUTOR_MAX_POOL_SIZE:2}
tribunal.ai.executor.queue-capacity=${TRIBUNAL_AI_EXECUTOR_QUEUE_CAPACITY:100}

spring.servlet.multipart.max-file-size=${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE:50MB}
spring.servlet.multipart.max-request-size=${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE:50MB}
server.tomcat.max-swallow-size=${SERVER_TOMCAT_MAX_SWALLOW_SIZE:50MB}
