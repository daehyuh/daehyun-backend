x-logging: &default-logging
  driver: json-file
  options:
    max-size: "${DOCKER_LOG_MAX_SIZE:-10m}"
    max-file: "${DOCKER_LOG_MAX_FILE:-5}"

services:
  app:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      - db
    volumes:
      - ./image:/upload/images
    environment:
      SPRING_DATASOURCE_URL: jdbc:mariadb://db:3306/daehyun
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?Set SPRING_DATASOURCE_PASSWORD}
      IMAGE_UPLOAD_DIR: /upload/images
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,prometheus
      TZ: Asia/Seoul
    logging: *default-logging

  db:
    image: mariadb:10.6
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?Set MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: daehyun
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    logging: *default-logging

volumes:
  mariadb_data:
